name: Build macOS DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or branch to build
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-macos-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dmg:
    name: Build unsigned macOS DMG
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Record build revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Disable updater signing for CI artifact
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/tauri.ci.conf.json" <<'JSON'
          {
            "productName": "MonoCode-Copilot",
            "identifier": "com.monocode.copilot",
            "bundle": {
              "createUpdaterArtifacts": false,
              "macOS": {
                "signingIdentity": "-"
              }
            }
          }
          JSON

      - name: Build DMG
        run: npx tauri build --bundles dmg --config "$RUNNER_TEMP/tauri.ci.conf.json"

      - name: Verify DMG
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(target/release/bundle/dmg/*.dmg)
          if (( ${#dmg_files[@]} != 1 )); then
            echo "Expected exactly one DMG, found ${#dmg_files[@]}" >&2
            exit 1
          fi
          hdiutil verify "${dmg_files[0]}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: monocode-copilot-macos-dmg-${{ steps.revision.outputs.sha }}
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
