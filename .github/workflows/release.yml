name: Release macOS DMG

on:
  push:
    tags:
      - "v*-copilot.*"

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS DMG
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Configure Copilot-branded macOS build
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/tauri.release.conf.json" <<'JSON'
          {
            "productName": "MonoCode-Copilot",
            "identifier": "com.monocode.copilot",
            "bundle": {
              "createUpdaterArtifacts": false,
              "macOS": {
                "signingIdentity": "-"
              }
            }
          }
          JSON

      - name: Build DMG
        run: npx tauri build --bundles dmg --config "$RUNNER_TEMP/tauri.release.conf.json"

      - name: Verify DMG
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(target/release/bundle/dmg/*.dmg)
          if (( ${#dmg_files[@]} != 1 )); then
            echo "Expected exactly one DMG, found ${#dmg_files[@]}" >&2
            exit 1
          fi
          hdiutil verify "${dmg_files[0]}"
          echo "path=${dmg_files[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: monocode-copilot-macos-dmg-${{ github.sha }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          dmg="${{ steps.dmg.outputs.path }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$dmg" \
              --title "MonoCode-Copilot ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
